name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Version comes from package.json's packageManager.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      # Root gates (doc surface, packs, evals, checkpoints, brand, staging, addresses) and the
      # compiled role-image build; the workspace suites run in node-tests below.
      - run: pnpm test:checks
      - run: pnpm test:role-image

  # The same workspace suites as `pnpm -r test`, split across runners so heavy suites do not starve
  # each other on 2-vCPU hosted runners. Together the groups cover every workspace.
  node-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group:
          - { name: engines, filter: "--filter @eko/engines", workers: "2" }
          # The indexer throughput benchmarks run one file at a time so they never compete with each other.
          - { name: indexer, filter: "--filter @eko/indexer", workers: "1" }
          - { name: server, filter: "--filter @eko/server --filter @eko/mcp --filter @eko/bots", workers: "2" }
          - { name: rest, filter: "--filter !@eko/engines --filter !@eko/indexer --filter !@eko/server --filter !@eko/mcp --filter !@eko/bots", workers: "2" }
    env:
      # Fresh runners may download the exact solc_version in foundry.toml.
      FOUNDRY_OFFLINE: 'false'
      VITEST_MAX_WORKERS: ${{ matrix.group.workers }}
      FILTER: ${{ matrix.group.filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --workspace-concurrency=1 $FILTER test

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FOUNDRY_OFFLINE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - run: node scripts/build-record.mjs
        working-directory: contracts
      - run: forge test
        working-directory: contracts
      - run: pnpm --filter @eko/contracts coverage

  slither:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FOUNDRY_OFFLINE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          # Pin the analyzer itself; the action installs the latest PyPI release otherwise.
          slither-version: 0.11.6
          fail-on: high
          slither-args: --json slither-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: slither-report
          path: slither-report.json
          if-no-files-found: error
          retention-days: 14

  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          semgrep scan --config p/typescript --config p/nodejs --config p/secrets
          --severity ERROR --error --metrics off --json --output semgrep-report.json
          apps/server apps/indexer apps/engines apps/mcp apps/bots apps/og-renderer packages/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: error
          retention-days: 14

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - run: gitleaks git --config .gitleaks.toml --redact --log-opts="--all" .

  # Public repository only: the identifier guard scans every historical blob, filename and commit
  # field against keyed fingerprints (docs/PUBLIC_HISTORY.md). It fails closed without the key.
  public-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public identifiers and complete history
        env:
          EKO_PUBLIC_GUARD_KEY: ${{ secrets.PUBLIC_GUARD_KEY }}
        run: python3 scripts/public-guard.py --mode history
      - name: Exercise negative privacy checks
        run: python3 scripts/test-public-guard.py
