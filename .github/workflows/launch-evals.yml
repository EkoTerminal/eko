name: Launch eval gates

# Nightly and on demand only: the gates stay red until measured acceptance evidence exists,
# so they report status without blocking ordinary pushes.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  eval-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gate: [B, T]
    env:
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:evals
      # No provider credentials or implicit paid generation. Missing measured evidence keeps the check red.
      - run: pnpm evals:nightly --gate ${{ matrix.gate }} --report evals/reports/ci-${{ github.run_id }}-${{ matrix.gate }}.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: launch-evals-${{ matrix.gate }}-${{ github.run_id }}
          path: evals/reports/
          if-no-files-found: error
          retention-days: 30
