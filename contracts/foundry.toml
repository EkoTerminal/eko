# BACKEND §14.1: solc 0.8.26, evm cancun, optimizer 10,000 runs, OpenZeppelin 5.x pinned.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
offline = true
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "../packages/shared/test/fixtures" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
rhc = "${RPC_HTTP_URL}"
